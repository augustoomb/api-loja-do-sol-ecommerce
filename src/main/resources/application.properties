spring.application.name=api-loja-do-sol-ecommerce

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

logging.pattern.level=%5p [req=%X{requestId}] [user=%X{userId}]

management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=com.augustoomb.api_loja_do_sol_ecommerce.controller

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

app.admin.name=${ADMIN_NAME:Administrador}
app.admin.email=${ADMIN_EMAIL:admin@admin.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.stripe.simulate=${STRIPE_SIMULATE:true}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
