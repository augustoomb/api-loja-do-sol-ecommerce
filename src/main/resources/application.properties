spring.application.name=api-loja-do-sol-ecommerce

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# ===== Redis (cache de leitura do catalogo) =====
# Se o Redis estiver indisponivel, o app continua funcionando (ver CacheConfig -> errorHandler)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

logging.pattern.level=%5p [req=%X{requestId}] [user=%X{userId}]

management.endpoints.web.exposure.include=health,info,metrics,loggers,cache
management.endpoint.health.show-details=never
# Redis e um cache OPCIONAL (degradaçao graciosa): se ele cair, a API continua no ar.
# Desligado o health indicator do Redis para o /actuator/health (e o healthcheck do
# docker-compose) nao marcarem o app como DOWN quando o cache estiver indisponivel.
management.health.redis.enabled=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=com.augustoomb.api_loja_do_sol_ecommerce.controller

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

app.admin.name=${ADMIN_NAME:Administrador}
app.admin.email=${ADMIN_EMAIL:admin@admin.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.stripe.simulate=${STRIPE_SIMULATE:true}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
